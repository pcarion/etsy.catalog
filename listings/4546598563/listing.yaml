    description: |-
        Celebrate your New York marathon finish with a personalized 11×17 poster featuring your name, finish time, pace, ranking, and race details.

        Choose between high-resolution digital files to print yourself, or a physical printed poster package.

        After ordering, you’ll receive access to our private customization application. No password, subscription, or credit card is required. Enter your Etsy receipt number, customize your information, and review proof images before approving your design.

        WHAT'S INCLUDED

        Digital Files Only:
        - Two matching high-resolution digital files: both Light and Dark versions optimized for 11×17 printing
        - Digital proofs for review before finalizing your files
        - Access to revise your information until you approve the design
        - Please note: No physical item will be shipped with this option.

        Map Print + Files:
        - One personalized 11×17-inch printed poster shipped to your door
        - Your choice of Bright or Dark design for the physical print
        - Two matching high-resolution digital files: both Light and Dark versions
        - Digital proofs for review before printing
        - Access to revise your information until you approve the design

        HOW PERSONALIZATION WORKS

        1. Purchase the listing and select your preferred format option (Digital Files Only or Map Print + Files).
        2. Open the customization link provided after purchase.
        3. Enter your Etsy receipt number.
        4. Add your name and race results.
        5. Optionally provide a link to your official results page to help populate the information.
        6. Review and revise your proof images.
        7. Select your final layout and approve the design.

        Nothing is printed or finalized until you approve your proof.

        Optional Garmin race-data visualization

        Want to tell the complete story of your race? During customization, you can optionally upload a compatible GPX file exported from Garmin or another fitness platform.
        Your race data will be transformed into a personalized visualization in the lower-left corner of the poster:
        - A pace graph showing how your speed changed throughout the race
        - An elevation profile colored according to your heart-rate data

        Your GPX file must contain the relevant time, elevation, and heart-rate data for every feature to be available. If heart-rate data is missing, the elevation profile can still be displayed without heart-rate coloring. Uploading a GPX file is optional.

        POSTER DETAILS

        - Printed poster size: 11 × 17 inches
        - Orientation: Portrait
        - Personalized and made to order
        - Printed in your selected Light or Dark style
        - Access to both Light and Dark digital versions included for all buyers
        - Frame and display accessories are not included
        - Colors may vary slightly between screens and the printed poster

        Please note
        Carefully review all names, times, rankings, and other details before approving the design.
        For physical orders, production begins immediately after approval, so approved personalization cannot subsequently be changed.
        Because this is a personalized product, returns and exchanges generally cannot be accepted unless it arrives damaged or contains a printing error. Please contact us if there is a problem with your order.

        This is an independently designed commemorative product and is not official merchandise or affiliated with, endorsed by, or sponsored by the race organizer. Event names are used only to identify the customer’s race.
